name: Import PDFs from Webflow (one-time)

# Copies the 15 PDFs currently in the CampusMind Webflow asset library into
# this repo under clean names, checks each one, and commits them.
on:
  push:
    paths:
      - ".github/workflows/import-pdfs.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download PDFs
        run: |
          set -euo pipefail
          site="69403e36029b25351a2fa081"
          while read -r name key size; do
            [ -z "$name" ] && continue
            curl -fsSL --retry 3 -o "$name" "https://cdn.prod.website-files.com/$site/$key" \
              || curl -fsSL --retry 3 -o "$name" "https://s3.amazonaws.com/webflow-prod-assets/$site/$key"
            head -c 5 "$name" | grep -q '%PDF-' || { echo "::error::$name is not a PDF"; exit 1; }
            got=$(stat -c %s "$name")
            [ "$got" = "$size" ] || { echo "::error::$name is $got bytes, expected $size"; exit 1; }
            echo "ok $name ($got bytes)"
          done <<'LIST'
          accessibility-agent-pricing-print.pdf 6aed418c732741b31443b5ad_CampusMind_AccessibilityAgent_PricingBrochure_2026-11_print.pdf 90650
          accessibility-agent-pricing.pdf 6aed418b22d9bc4cb2c35808_CampusMind_AccessibilityAgent_PricingBrochure_2026-11_accessible.pdf 95860
          ai-studio-pricing-print.pdf 6aed418be3a4a4c2ac8db9e5_CampusMind_AIStudio_PricingBrochure_2026-11_print.pdf 74253
          ai-studio-pricing.pdf 6aed418bed006d1305fc284f_CampusMind_AIStudio_PricingBrochure_2026-11_accessible.pdf 78248
          campus-chat-plus-pricing-print.pdf 6aed418b90bb60cd6d942e0e_CampusMind_CampusChatPlus_PricingBrochure_2026-11_print.pdf 75342
          campus-chat-plus-pricing.pdf 6aed418b1c9dca378488300f_CampusMind_CampusChatPlus_PricingBrochure_2026-11_accessible.pdf 79285
          data-bridge-pricing-print.pdf 6aed418b1c9dca3784883017_CampusMind_DataBridge_PricingBrochure_2026-11_print.pdf 78512
          data-bridge-pricing.pdf 6aed418b61545a54618731ec_CampusMind_DataBridge_PricingBrochure_2026-11_accessible.pdf 82471
          pdf-accessibility-guide.pdf 6aed4bef48ef9dc17826865b_CampusMind-PDF-Accessibility-Guide.pdf 4431830
          recruitment-agent-pricing-print.pdf 6aed418bb323aadd20e27035_CampusMind_RecruitmentAgent_PricingBrochure_2026-11_print.pdf 73268
          recruitment-agent-pricing.pdf 6aed418c862983af33c7949d_CampusMind_RecruitmentAgent_PricingBrochure_2026-11_accessible.pdf 77313
          retention-agent-pricing-print.pdf 6aed418c45a2f3ef0285975f_CampusMind_RetentionAgent_PricingBrochure_2026-11_print.pdf 74783
          retention-agent-pricing.pdf 6aed418c3702c5f273dff4d6_CampusMind_RetentionAgent_PricingBrochure_2026-11_accessible.pdf 78849
          virtual-teaching-assistant-pricing-print.pdf 6aed418b90bb60cd6d942e15_CampusMind_VirtualTeachingAssistant_PricingBrochure_2026-11_print.pdf 70974
          virtual-teaching-assistant-pricing.pdf 6aed418b04aa34248fa76593_CampusMind_VirtualTeachingAssistant_PricingBrochure_2026-11_accessible.pdf 74924
          LIST

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add -- *.pdf
          git commit -m "Add pricing brochures and PDF Accessibility Guide from Webflow" || echo "Nothing new to commit"
          git push
